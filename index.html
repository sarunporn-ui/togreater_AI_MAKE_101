// ... (โค้ดส่วนต้นเหมือนเดิม)
  <script>
    let lineUserId = "Unknown";
    let lineDisplayName = "Unknown";

    const LIFF_ID = "2009958079-Hb8CbRfx"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby7ZEKUUkpInYDxIbW9JobKnt8oDMY0qveJjlarviSTrMb8PYfKgCNaecjU2aCJS3Ox/exec"; 

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
          lineDisplayName = profile.displayName;
          console.log("Logged in as: ", lineUserId);
        }
      } catch (err) {
        alert("LIFF Init Error: " + err);
      }
    }
    initLiff();

    function submitForm(event) {
      event.preventDefault();
      
      // Safety Check: ถ้ายังไม่โหลด ID ห้ามส่ง
      if (lineUserId === "Unknown") {
        alert("กำลังโหลดข้อมูล LINE... โปรดรอสักครู่แล้วกดใหม่");
        return;
      }
      
      const btn = document.getElementById("submitBtn");
      const loading = document.getElementById("loading");
      btn.disabled = true;
      loading.style.display = "block";

      const formData = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        userId: lineUserId,
        displayName: lineDisplayName
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(formData)
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          alert("ลงทะเบียนสำเร็จ!");
          liff.closeWindow();
        } else {
          alert("Error: " + data.message);
          btn.disabled = false;
          loading.style.display = "none";
        }
      })
      .catch(error => {
        alert("Server Error: " + error);
        btn.disabled = false;
        loading.style.display = "none";
      });
    }
  </script>
