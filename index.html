<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKE AI 101 Registration</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LineSeed/LineSeed.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    :root {
      --primary-color: #06C755;
      --bg-color: #F4F6F8; /* โทนสว่างคล้าย Moodboard */
      --card-bg: #FFFFFF;
      --text-main: #333333;
    }

    body { 
      font-family: 'LINE Seed Sans TH', sans-serif; 
      background-color: var(--bg-color); 
      margin: 0; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container { 
      background: var(--card-bg); 
      padding: 40px 30px; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); /* เงาบางๆ ดู Minimal */
      border: 1px solid #e1e1e1;
    }

    .header { text-align: center; margin-bottom: 30px; }
    .icon-box { background: #E9FBF0; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
    
    .header h1 { color: var(--primary-color); font-size: 24px; margin: 0; }
    .header p { font-size: 14px; color: #777; margin-top: 5px; }

    .info-box { 
      background: #F9FAFB; 
      padding: 15px; 
      border-radius: 12px; 
      font-size: 14px; 
      margin-bottom: 25px; 
      border-left: 4px solid var(--primary-color); 
      color: #555;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: #444; }
    input { 
      width: 100%; padding: 12px; border: 1.5px solid #E5E7EB; border-radius: 10px; 
      box-sizing: border-box; font-family: 'LINE Seed Sans TH', sans-serif;
      transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: var(--primary-color); }
    
    button { 
      width: 100%; padding: 15px; background-color: var(--primary-color); color: white; 
      border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; 
      font-family: 'LINE Seed Sans TH', sans-serif; margin-top: 10px;
    }
    button:disabled { background-color: #A0A0A0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="icon-box">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#06C755" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </div>
      <h1>MAKE AI 101</h1>
      <p>โดย เกรท เพื่อนสนิท AI (Togreater)</p>
    </div>

    <div class="info-box">
      <strong>กำหนดการ:</strong> 20 พ.ค. 2026<br>
      <strong>เวลา:</strong> 19.00 - 20.00 น. (Online)
    </div>

    <form id="regForm" onsubmit="submitForm(event)">
      <div class="form-group">
        <label>ชื่อ-นามสกุล</label>
        <input type="text" id="name" placeholder="ชื่อของคุณ" required>
      </div>
      <div class="form-group">
        <label>เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" placeholder="08x-xxx-xxxx" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@example.com" required>
      </div>
      <button type="submit" id="submitBtn">ลงทะเบียนรับสิทธิ์</button>
    </form>
  </div>

  <script>
    // ใส่ค่าของคุณที่นี่
    const LIFF_ID = "2009958079-Hb8CbRfx"; 
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby7ZEKUUkpInYDxIbW9JobKnt8oDMY0qveJjlarviSTrMb8PYfKgCNaecjU2aCJS3Ox/exec"; 

    window.onload = async () => {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) liff.login();
      } catch (err) { console.error(err); }
    };

    async function submitForm(event) {
      event.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      const profile = await liff.getProfile();
      const formData = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        userId: profile.userId,
        displayName: profile.displayName
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(formData)
      })
      .then(res => res.json())
      .then(data => {
        alert("คุณสมัครเสร็จเรียบร้อย\nเช็คลิงก์ได้ที่ LINE OA โค้ชเกรท ToGreater");
        liff.closeWindow();
      })
      .catch(err => {
        alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
        btn.disabled = false;
        btn.innerText = "ลงทะเบียนรับสิทธิ์";
      });
    }
  </script>
</body>
</html>
